name: Build Test Deploy

on:
  push:
    branches: [main]

jobs:
  # ---------- BUILD ----------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t app-web:${{ github.sha }} .

  # ---------- TEST ----------
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HTML
        run: |
          sudo apt-get update && sudo apt-get install -y tidy
          tidy -q -e index.html; [ $? -le 1 ]

  # ---------- DEPLOY ----------
  # deploy ย้ายไป Railway แล้ว — Railway ต่อกับ GitHub repo นี้และ auto-deploy
  # ทุกครั้งที่ push เข้า main เอง (แก้ไข job เดิม: git history)
